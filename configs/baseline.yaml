model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  served_name: llm-model

hardware:
  gpu: Tesla T4
  gpu_count: 2

vllm:
  version: "0.30.0"
  max_model_len: 2000
  gpu_memory_utilization: 0.85

parallelism_configs:
  - name: baseline_1gpu
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    gpus: [0]

  - name: tensor_parallel_2gpu
    tensor_parallel_size: 2
    pipeline_parallel_size: 1
    gpus: [0, 1]

  - name: pipeline_parallel_2gpu
    tensor_parallel_size: 1
    pipeline_parallel_size: 2
    gpus: [0, 1]

workload:
  dataset: random
  input_len: 430
  output_len: 1000
  num_prompts: 50

experiment:
  variables:
    - max_num_seqs
    - request_rate

  max_num_seqs:
    - 16
    - 32
    - 64
    - 96
    - 160

  request_rate:
    - 0.1
    - 0.2
    - 0.3
    - 0.5
    - 1
    - 2

  repetitions: 3
  warmup: true

slo:
  ttft_ms: 2000
  tpot_ms: 50

cost:
  hourly_gpu_cost_usd: 0.526
  gpu_count_for_cost: 2